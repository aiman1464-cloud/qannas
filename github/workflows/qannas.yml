name: Qannas
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Qannas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python qannas.py
      - name: Save state
        run: |
          git config user.name "qannas"
          git config user.email "qannas@users.noreply.github.com"
          git add seen.json opportunities.csv
          git commit -m "update" || echo "no changes"
          git push
